name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ vars.SITE_BASE || '/fahint-electric-website/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Keep missing or unsafe published assets from reaching GitHub Pages.
      - run: npm test

      # SITE_BASE controls the asset path.
      # - Custom domain (e.g. www.fahint.com via Cloudflare)  -> leave as "/"
      # - GitHub project page (user.github.io/<repo>/)        -> use "/<repo>/"
      # Build includes prerendering, base validation, the fallback and .nojekyll.
      - name: Build
        run: npm run build
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
